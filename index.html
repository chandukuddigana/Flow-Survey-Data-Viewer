<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Survey Data Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; color: #222; background-color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; border-right: 1px solid #1e293b; flex-shrink: 0; }
        .sidebar-header { padding: 20px; background: #020617; border-bottom: 1px solid #1e293b; }
        .sidebar-header h2 { margin: 0; font-size: 14px; color: #38bdf8; text-transform: uppercase; }
        .file-list { flex: 1; overflow-y: auto; padding: 15px 10px; }
        .list-section-title { font-size: 11px; color: #64748b; font-weight: bold; text-transform: uppercase; margin: 15px 0 5px 5px; }
        .station-item { padding: 10px; margin-bottom: 6px; border-radius: 6px; background: #1e293b; cursor: pointer; font-size: 13px; border: 1px solid #334155; }
        .station-item.active { background: #22c55e; color: white; font-weight: bold; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .upload-zone { border: 2px dashed #38bdf8; padding: 50px; margin: 25px; text-align: center; background: white; cursor: pointer; }
        .workspace { display: none; padding: 25px; }
        .graph-pane { background: white; padding: 15px; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 20px; height: 250px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #1e3a8a; padding: 8px; text-align: center; font-size: 12px; }
        th { background: #f0f4f8; color: #1e3a8a; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header"><h2>Flow Survey Data Viewer</h2></div>
    <div class="file-list">
        <div class="list-section-title">Select Monitor</div>
        <div id="fdvListContainer"></div>
        <div class="list-section-title">Rainfall Sources</div>
        <div id="rainInventoryContainer"></div>
    </div>
</div>

<div class="main-content">
    <div id="dropZone" class="upload-zone">
        <input type="file" id="fileInput" multiple style="display:none">
        <p>Drop files here or click to select</p>
    </div>
    <div id="workspace" class="workspace">
        <div class="graph-pane"><h3>Rainfall Intensity (mm/hr)</h3><canvas id="rainChart"></canvas></div>
        <div class="graph-pane"><h3>Cumulative Rainfall (mm)</h3><canvas id="cumulativeChart"></canvas></div>
        <table id="statsTable">
            <thead><tr><th>Metric</th><th>Rain (mm/hr)</th><th>Depth (mm)</th></tr></thead>
            <tbody id="statsBody">
                <tr><td class="label-cell">Total</td><td id="totalIntensity">0</td><td id="totalDepth">0</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // 1. STOP BROWSER DEFAULT BEHAVIOR
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
        window.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }, false);
    });

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => handleFiles(e.target.files));
    dropZone.addEventListener('drop', e => handleFiles(e.dataTransfer.files));

    function handleFiles(files) {
        dropZone.style.display = 'none';
        document.getElementById('workspace').style.display = 'block';

        for (let file of files) {
            const reader = new FileReader();
            reader.onload = (e) => {
                if (file.name.toLowerCase().endsWith('.r')) {
                    const data = processRainFile(e.target.result, file.name);
                    // Add your Chart.js rendering code here using data.intensity and data.depths
                    document.getElementById('totalDepth').textContent = data.totalDepth.toFixed(2);
                } else if (file.name.toLowerCase().endsWith('.fdv')) {
                    processFdv(e.target.result, file.name);
                }
            };
            reader.readAsText(file);
        }
    }

    function processRainFile(text, fileName) { 
        const lines = text.split(/\r?\n/); 
        let intervalMinutes = 2; 
        let rawIntensity = []; 
        let inData = false; 
        
        for (let line of lines) { 
            if (line.startsWith('*CEND')) { inData = true; continue; } 
            if (inData) { 
                line.split(/\s+/).forEach(val => { 
                    let v = parseFloat(val); 
                    if (!isNaN(v)) rawIntensity.push(v); 
                }); 
            } 
        } 
        
        const intervalHours = intervalMinutes / 60; 
        const depths = rawIntensity.map(intensity => intensity * intervalHours); 
        const totalDepth = depths.reduce((sum, d) => sum + d, 0); 
        
        return { intensity: rawIntensity, depths: depths, totalDepth: totalDepth }; 
    }

    function processFdv(text, name) { 
        const cleanName = name.replace(/\.[fF][dD][vV]$/, ''); 
        const div = document.createElement('div'); 
        div.className = 'station-item'; 
        div.textContent = cleanName; 
        document.getElementById('fdvListContainer').appendChild(div); 
    }
</script>
</body>
</html>
