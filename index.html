<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flow Survey Data Viewer</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f1f5f9;
    color:#1e293b;
}

.topbar{
    background:white;
    padding:14px 24px;
    border-bottom:1px solid #dbe3ec;
    font-size:22px;
    font-weight:bold;
}

.upload-zone{
    margin:20px;
    padding:50px;
    border:2px dashed #2563eb;
    border-radius:10px;
    background:white;
    text-align:center;
    cursor:pointer;
}

.upload-zone:hover{
    background:#eff6ff;
}

#fileInput{
    display:none;
}

.status{
    margin-top:14px;
    color:#2563eb;
    font-weight:bold;
}

.workspace{
    display:none;
    padding:20px;
}

.controls{
    display:flex;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

select{
    padding:10px 14px;
    border-radius:6px;
    border:1px solid #cbd5e1;
    min-width:250px;
}

.chart-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:20px;
}

.chart-box{
    background:white;
    border-radius:10px;
    border:1px solid #dbe3ec;
    padding:15px;
}

.chart-box h3{
    margin-top:0;
    font-size:13px;
    text-transform:uppercase;
    color:#334155;
}

.chart-container{
    position:relative;
    height:260px;
}

.info-panel{
    margin-top:20px;
    background:white;
    border-radius:10px;
    border:1px solid #dbe3ec;
    padding:16px;
}

.info-row{
    margin-bottom:8px;
}

.error{
    color:red;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="topbar">
    Flow Survey Data Viewer
</div>

<div class="upload-zone" id="dropZone">

    <input type="file" id="fileInput" multiple>

    <div style="font-size:22px;font-weight:bold;">
        Click or Drag Files Here
    </div>

    <div style="margin-top:12px;">
        Upload .FDV and .R files
    </div>

    <div class="status" id="status">
        Ready...
    </div>

</div>

<div class="workspace" id="workspace">

    <div class="controls">

        <select id="monitorSelector">
            <option value="">Select Monitor</option>
        </select>

        <select id="rainSelector">
            <option value="">Select Rain Gauge</option>
        </select>

    </div>

    <div class="chart-grid">

        <div class="chart-box">
            <h3>Rainfall Intensity (mm/hr)</h3>
            <div class="chart-container">
                <canvas id="rainChart"></canvas>
            </div>
        </div>

        <div class="chart-box">
            <h3>Cumulative Rainfall (mm)</h3>
            <div class="chart-container">
                <canvas id="cumulativeChart"></canvas>
            </div>
        </div>

        <div class="chart-box">
            <h3>Depth (mm)</h3>
            <div class="chart-container">
                <canvas id="depthChart"></canvas>
            </div>
        </div>

        <div class="chart-box">
            <h3>Flow (L/s)</h3>
            <div class="chart-container">
                <canvas id="flowChart"></canvas>
            </div>
        </div>

        <div class="chart-box">
            <h3>Velocity (m/s)</h3>
            <div class="chart-container">
                <canvas id="velocityChart"></canvas>
            </div>
        </div>

    </div>

    <div class="info-panel">

        <div class="info-row">
            <b>FDV Start:</b>
            <span id="fdvStart"></span>
        </div>

        <div class="info-row">
            <b>FDV End:</b>
            <span id="fdvEnd"></span>
        </div>

        <div class="info-row">
            <b>Total FDV Records:</b>
            <span id="fdvCount"></span>
        </div>

        <div class="info-row">
            <b>Total Rain Records:</b>
            <span id="rainCount"></span>
        </div>

    </div>

</div>

<script>

/* ============================================================
   GLOBALS
============================================================ */

let fdvDatabase = {};
let rainDatabase = {};

let charts = {};

const fileInput =
    document.getElementById('fileInput');

const dropZone =
    document.getElementById('dropZone');

const statusDiv =
    document.getElementById('status');

const workspace =
    document.getElementById('workspace');

const monitorSelector =
    document.getElementById('monitorSelector');

const rainSelector =
    document.getElementById('rainSelector');

/* ============================================================
   FILE INPUT
============================================================ */

dropZone.addEventListener('click', () => {
    fileInput.click();
});

dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
});

dropZone.addEventListener('drop', (e) => {

    e.preventDefault();

    handleFiles(e.dataTransfer.files);
});

fileInput.addEventListener('change', (e) => {
    handleFiles(e.target.files);
});

/* ============================================================
   DATE PARSER
============================================================ */

function parseTelemetryDate(raw){

    try{

        const clean =
            raw.toString().trim();

        if(clean.length !== 10){
            return null;
        }

        const yy =
            parseInt(clean.slice(0,2));

        const mm =
            parseInt(clean.slice(2,4)) - 1;

        const dd =
            parseInt(clean.slice(4,6));

        const hh =
            parseInt(clean.slice(6,8));

        const mi =
            parseInt(clean.slice(8,10));

        const fullYear =
            yy >= 70
            ? 1900 + yy
            : 2000 + yy;

        return new Date(
            fullYear,
            mm,
            dd,
            hh,
            mi
        );

    } catch(err){

        return null;
    }
}

/* ============================================================
   DATE FORMATTER
============================================================ */

function formatDate(date){

    if(!date) return '';

    const y =
        date.getFullYear();

    const m =
        String(date.getMonth()+1)
        .padStart(2,'0');

    const d =
        String(date.getDate())
        .padStart(2,'0');

    const h =
        String(date.getHours())
        .padStart(2,'0');

    const mi =
        String(date.getMinutes())
        .padStart(2,'0');

    return `${y}-${m}-${d} ${h}:${mi}`;
}

/* ============================================================
   R FILE PARSER
============================================================ */

function processRainFile(contentText, fileName){

    try{

        const lines =
            contentText.split(/\r?\n/);

        let startDate = null;
        let endDate = null;
        let intervalMinutes = 2;

        let insideConstants = false;
        let insideData = false;

        let values = [];

        for(let line of lines){

            const clean =
                line.trim();

            if(clean.includes('*CSTART')){
                insideConstants = true;
                continue;
            }

            if(clean.includes('*CEND')){
                insideConstants = false;
                insideData = true;
                continue;
            }

            if(insideConstants){

                const match =
                    clean.match(
                        /(\d{10})\s+(\d{10})\s+(\d+)/
                    );

                if(match){

                    startDate =
                        parseTelemetryDate(match[1]);

                    endDate =
                        parseTelemetryDate(match[2]);

                    intervalMinutes =
                        parseInt(match[3]);
                }
            }

            else if(insideData){

                const nums =
                    clean.match(/-?\d+\.?\d*/g);

                if(nums){

                    nums.forEach(n => {

                        values.push(
                            parseFloat(n)
                        );
                    });
                }
            }
        }

        if(!startDate){

            console.error(
                `Rain parser failed for ${fileName}`
            );

            return null;
        }

        const timestamps = [];

        const intervalMs =
            intervalMinutes *
            60 *
            1000;

        for(let i=0;i<values.length;i++){

            timestamps.push(

                new Date(
                    startDate.getTime() +
                    i * intervalMs
                )
            );
        }

        let cumulative = [];

        let running = 0;

        values.forEach(v => {

            running +=
                (v * intervalMinutes) / 60;

            cumulative.push(running);
        });

        return {

            fileName,

            timestamps,

            intensity:values,

            cumulative,

            intervalMinutes
        };

    } catch(err){

        console.error(err);

        return null;
    }
}

/* ============================================================
   FDV PARSER
============================================================ */

function processFdvFile(contentText, fileName){

    try{

        const lines =
            contentText.split(/\r?\n/);

        let timestamps = [];
        let depth = [];
        let flow = [];
        let velocity = [];

        for(let line of lines){

            const clean =
                line.trim();

            if(!clean){
                continue;
            }

            const nums =
                clean.match(/-?\d+\.?\d*/g);

            if(!nums){
                continue;
            }

            if(nums.length >= 4){

                const dateStr =
                    nums[0];

                if(dateStr.length === 10){

                    const dt =
                        parseTelemetryDate(dateStr);

                    if(dt){

                        timestamps.push(dt);

                        depth.push(
                            parseFloat(nums[1])
                        );

                        flow.push(
                            parseFloat(nums[2])
                        );

                        velocity.push(
                            parseFloat(nums[3])
                        );
                    }
                }
            }
        }

        if(timestamps.length === 0){

            console.error(
                `No FDV telemetry found in ${fileName}`
            );

            return null;
        }

        let intervalMinutes = 2;

        if(timestamps.length >= 2){

            intervalMinutes =
                (
                    timestamps[1].getTime() -
                    timestamps[0].getTime()
                ) / (60*1000);
        }

        return {

            fileName,

            timestamps,

            depth,

            flow,

            velocity,

            intervalMinutes
        };

    } catch(err){

        console.error(err);

        return null;
    }
}

/* ============================================================
   RAINFALL SYNCHRONIZATION
============================================================ */

function synchronizeRainfallToFdv(
    fdvData,
    rainData
){

    const fdvStart =
        fdvData.timestamps[0].getTime();

    const fdvEnd =
        fdvData.timestamps[
            fdvData.timestamps.length - 1
        ].getTime();

    const intervalMs =
        fdvData.intervalMinutes *
        60 *
        1000;

    const rainMap =
        new Map();

    for(let i=0;i<rainData.timestamps.length;i++){

        rainMap.set(

            rainData.timestamps[i].getTime(),

            rainData.intensity[i]
        );
    }

    let syncedTimestamps = [];
    let syncedIntensity = [];
    let syncedCumulative = [];

    let cumulative = 0;

    for(
        let t = fdvStart;
        t <= fdvEnd;
        t += intervalMs
    ){

        syncedTimestamps.push(
            new Date(t)
        );

        const val =
            rainMap.has(t)
            ? rainMap.get(t)
            : 0;

        syncedIntensity.push(val);

        cumulative +=
            (val * fdvData.intervalMinutes) / 60;

        syncedCumulative.push(cumulative);
    }

    return {

        ...rainData,

        timestamps:syncedTimestamps,

        intensity:syncedIntensity,

        cumulative:syncedCumulative
    };
}

/* ============================================================
   FILE HANDLER
============================================================ */

function handleFiles(files){

    fdvDatabase = {};
    rainDatabase = {};

    statusDiv.innerText =
        'Processing files...';

    let processed = 0;

    for(let file of files){

        const reader =
            new FileReader();

        reader.onload = function(e){

            const text =
                e.target.result;

            const upper =
                file.name.toUpperCase();

            try{

                if(
                    upper.endsWith('.R') ||
                    text.includes('INTENSITY')
                ){

                    const rain =
                        processRainFile(
                            text,
                            file.name
                        );

                    if(rain){
                        rainDatabase[file.name] = rain;
                    }
                }

                else {

                    const fdv =
                        processFdvFile(
                            text,
                            file.name
                        );

                    if(fdv){
                        fdvDatabase[file.name] = fdv;
                    }
                }

            } catch(err){

                console.error(err);
            }

            processed++;

            if(processed === files.length){

                finalizeData();
            }
        };

        reader.readAsText(file);
    }
}

/* ============================================================
   FINALIZE
============================================================ */

function finalizeData(){

    const fdvKeys =
        Object.keys(fdvDatabase);

    const rainKeys =
        Object.keys(rainDatabase);

    if(fdvKeys.length === 0){

        statusDiv.innerHTML =
            '<span class="error">No FDV data detected</span>';

        return;
    }

    if(rainKeys.length === 0){

        statusDiv.innerHTML =
            '<span class="error">No Rainfall data detected</span>';

        return;
    }

    monitorSelector.innerHTML = '';
    rainSelector.innerHTML = '';

    fdvKeys.forEach(key => {

        const opt =
            document.createElement('option');

        opt.value = key;
        opt.textContent = key;

        monitorSelector.appendChild(opt);
    });

    rainKeys.forEach(key => {

        const opt =
            document.createElement('option');

        opt.value = key;
        opt.textContent = key;

        rainSelector.appendChild(opt);
    });

    const fdv =
        fdvDatabase[fdvKeys[0]];

    const rain =
        rainDatabase[rainKeys[0]];

    rainDatabase[rainKeys[0]] =
        synchronizeRainfallToFdv(
            fdv,
            rain
        );

    workspace.style.display =
        'block';

    statusDiv.innerText =
        'Files loaded successfully';

    renderCharts();
}

/* ============================================================
   RENDER CHARTS
============================================================ */

function renderCharts(){

    const fdvKey =
        monitorSelector.value ||
        Object.keys(fdvDatabase)[0];

    const rainKey =
        rainSelector.value ||
        Object.keys(rainDatabase)[0];

    const fdv =
        fdvDatabase[fdvKey];

    const rain =
        rainDatabase[rainKey];

    if(!fdv || !rain){
        return;
    }

    document.getElementById('fdvStart')
        .innerText =
        formatDate(fdv.timestamps[0]);

    document.getElementById('fdvEnd')
        .innerText =
        formatDate(
            fdv.timestamps[
                fdv.timestamps.length - 1
            ]
        );

    document.getElementById('fdvCount')
        .innerText =
        fdv.timestamps.length;

    document.getElementById('rainCount')
        .innerText =
        rain.timestamps.length;

    const labels =
        fdv.timestamps.map(formatDate);

    createChart(
        'rainChart',
        'bar',
        labels,
        rain.intensity,
        'Rainfall'
    );

    createChart(
        'cumulativeChart',
        'line',
        labels,
        rain.cumulative,
        'Cumulative'
    );

    createChart(
        'depthChart',
        'line',
        labels,
        fdv.depth,
        'Depth'
    );

    createChart(
        'flowChart',
        'line',
        labels,
        fdv.flow,
        'Flow'
    );

    createChart(
        'velocityChart',
        'line',
        labels,
        fdv.velocity,
        'Velocity'
    );
}

/* ============================================================
   CHART CREATOR
============================================================ */

function createChart(
    canvasId,
    type,
    labels,
    data,
    label
){

    if(charts[canvasId]){
        charts[canvasId].destroy();
    }

    const ctx =
        document
        .getElementById(canvasId)
        .getContext('2d');

    charts[canvasId] =
        new Chart(ctx, {

            type,

            data:{

                labels,

                datasets:[{

                    label,

                    data,

                    borderWidth:1
                }]
            },

            options:{

                responsive:true,

                maintainAspectRatio:false,

                animation:false,

                scales:{
                    x:{
                        ticks:{
                            maxTicksLimit:10
                        }
                    }
                }
            }
        });
}

/* ============================================================
   SELECTOR EVENTS
============================================================ */

monitorSelector.addEventListener(
    'change',
    renderCharts
);

rainSelector.addEventListener(
    'change',
    renderCharts
);

</script>

</body>
</html>
