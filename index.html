<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Pane Flow Survey Plotter</title>
    <!-- Core chart and sheet parsers -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; color: #333; background-color: #fcfcfc; }
        .container { max-width: 1400px; margin: 0 auto; }
        .upload-zone { border: 2px dashed #0066cc; padding: 20px; text-align: center; background: #fff; border-radius: 8px; margin-bottom: 20px; }
        #fileInput { display: none; }
        .btn { background: #0066cc; color: white; padding: 10px 20px; border-radius: 5px; cursor: pointer; display: inline-block; font-weight: bold; }
        .status { margin-top: 10px; color: #222; font-weight: 600; }
        
        .dashboard { display: none; margin-top: 20px; }
        .graph-pane { background: #fff; padding: 15px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); position: relative; height: 260px; }
        h3 { margin: 0 0 10px 0; font-size: 14px; color: #0044aa; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Flow Survey Multi-Pane Viewer <span style="font-size:14px; font-weight:normal; color:#666;">(Stacked ICM Hydrographs)</span></h2>
        
        <div class="upload-zone" id="dropZone">
            <label for="fileInput" class="btn">Select Flow File</label>
            <input type="file" id="fileInput" accept=".xlsx, .xls, .fdv, .txt, .csv">
            <p style="margin: 8px 0 0 0; color: #555;">Drop your .fdv or telemetry data file here</p>
            <div id="status" class="status">Awaiting data input...</div>
        </div>

        <div class="dashboard" id="dashboard">
            <!-- Stacked Panes for simultaneous hydraulic tracking -->
            <div class="graph-pane" id="pane-depth">
                <h3>Depth / Level Profile</h3>
                <canvas id="depthChart"></canvas>
            </div>
            <div class="graph-pane" id="pane-velocity">
                <h3>Velocity Profile</h3>
                <canvas id="velocityChart"></canvas>
            </div>
            <div class="graph-pane" id="pane-flow">
                <h3>Flow Rate Profile</h3>
                <canvas id="flowChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const statusDiv = document.getElementById('status');
        const dashboard = document.getElementById('dashboard');
        
        let charts = { depth: null, velocity: null, flow: null };

        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#0044aa'; });
        dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#0066cc'; });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (!file) return;
            statusDiv.textContent = `Processing data arrays...`;
            dashboard.style.display = 'none';

            const extension = file.name.split('.').pop().toLowerCase();
            if (extension === 'xlsx' || extension === 'xls') {
                parseExcel(file);
            } else {
                parseFlowText(file);
            }
        }

        function parseExcel(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                processDataset(jsonData);
            };
            reader.readAsArrayBuffer(file);
        }

        function parseFlowText(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const lines = e.target.result.split(/\r?\n/);
                const matrix = [];
                let tracking = false;

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    
                    if (!tracking && (line.toLowerCase().includes('date') || line.toLowerCase().includes('time') || line.match(/^[0-9]/))) {
                        tracking = true;
                    }
                    if (tracking) {
                        let row = line.includes(',') ? line.split(',') : (line.includes('\t') ? line.split('\t') : line.split(/\s+/));
                        matrix.push(row.map(cell => cell.replace(/['"]/g, '').trim()));
                    }
                }
                processDataset(matrix);
            };
            reader.readAsText(file);
        }

        function processDataset(matrix) {
            if (!matrix || matrix.length < 2) {
                statusDiv.textContent = "Error: Invalid data matrix structure.";
                return;
            }

            const headers = matrix[0];
            const timeLabels = [];
            
            // Arrays to isolate specific parameters
            const dataArrays = { depth: [], velocity: [], flow: [] };
            
            // Map columns by matching keyword identifiers common in hydraulic logs
            let indices = { depth: -1, velocity: -1, flow: -1 };
            headers.forEach((h, idx) => {
                const name = h.toLowerCase();
                if (name.includes('depth') || name.includes('level') || name.includes('dpth') || name.includes('mm')) {
                    if (indices.depth === -1) indices.depth = idx;
                } else if (name.includes('vel') || name.includes('vms') || name.includes('speed') || name.includes('m/s')) {
                    if (indices.velocity === -1) indices.velocity = idx;
                } else if (name.includes('flow') || name.includes('q') || name.includes('m3s') || name.includes('l/s')) {
                    if (indices.flow === -1) indices.flow = idx;
                }
            });

            // Fallback strategy if specific headers aren't explicitly named
            if (indices.depth === -1) indices.depth = 1; 
            if (indices.velocity === -1) indices.velocity = indices.depth + 1 < headers.length ? indices.depth + 1 : 1;
            if (indices.flow === -1) indices.flow = indices.velocity + 1 < headers.length ? indices.velocity + 1 : 1;

            // Extract values line by line
            for (let i = 1; i < matrix.length; i++) {
                const row = matrix[i];
                if (!row || row.length < headers.length) continue;

                const timestamp = row[0] + (row[1] && isNaN(row[1]) ? ' ' + row[1] : '');
                timeLabels.push(timestamp);

                // Safe parsing helper
                const getVal = (idx) => {
                    let v = parseFloat(row[idx]);
                    return isNaN(v) ? 0 : v;
                };

                dataArrays.depth.push(getVal(indices.depth));
                dataArrays.velocity.push(getVal(indices.velocity));
                dataArrays.flow.push(getVal(indices.flow));
            }

            statusDiv.textContent = `Successfully parsed! Rendering stacked hydrographs...`;
            dashboard.style.display = 'block';

            // Build individual visual panes
            createPane('depthChart', timeLabels, dataArrays.depth, headers[indices.depth] || 'Depth', '#4a90e2', 'rgba(74, 144, 226, 0.05)', 'depth');
            createPane('velocityChart', timeLabels, dataArrays.velocity, headers[indices.velocity] || 'Velocity', '#47c9a2', 'rgba(71, 201, 162, 0.05)', 'velocity');
            createPane('flowChart', timeLabels, dataArrays.flow, headers[indices.flow] || 'Flow', '#e056fd', 'rgba(224, 86, 253, 0.05)', 'flow');
        }

        function createPane(canvasId, labels, data, title, primaryColor, fillColor, key) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            
            if (charts[key]) {
                charts[key].destroy();
            }

            charts[key] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: title,
                        data: data,
                        borderColor: primaryColor,
                        backgroundColor: fillColor,
                        borderWidth: 1.8,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        fill: true,
                        tension: 0.05
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { maxTicksLimit: 10, color: '#777', font: { size: 10 } }
                        },
                        y: {
                            grid: { color: '#f0f0f0' },
                            ticks: { color: '#555', font: { size: 11 } },
                            title: { display: true, text: title, font: { weight: 'bold', size: 12 } }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: { mode: 'index', intersect: false }
                    }
                }
            });
        }
    </script>
</body>
</html>
