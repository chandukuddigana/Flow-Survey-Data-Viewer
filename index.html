<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flow Survey Dashboard V20</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f3f3;
    color:#222;
}

.header{
    background:#1f2937;
    color:white;
    padding:16px 24px;
    font-size:24px;
    font-weight:bold;
}

#dropZone{
    margin:20px;
    border:3px dashed #999;
    border-radius:10px;
    background:white;
    padding:60px;
    text-align:center;
    font-size:20px;
    transition:0.3s;
    cursor:pointer;
}

#dropZone.dragover{
    background:#eef6ff;
    border-color:#1e88e5;
}

#app{
    display:none;
}

.loading-box{
    margin-top:20px;
    font-size:14px;
    color:#444;
}

.top-header{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin-top:10px;
    font-size:28px;
    font-weight:bold;
    color:#e53935;
}

.nav-btn{
    border:none;
    background:none;
    color:#e53935;
    font-size:24px;
    cursor:pointer;
}

.dashboard-layout{
    display:grid;
    grid-template-columns:5fr 1fr;
    gap:20px;
    padding:10px 20px 20px;
}

.left-panel{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.right-panel{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.chart-box{
    background:#ffffff;
    border:1px solid #d7d7d7;
    border-radius:6px;
    padding:8px;
}

.chart-title{
    font-size:11px;
    font-weight:bold;
    margin-bottom:5px;
    text-transform:uppercase;
    color:#002d72;
}

.red-title{
    color:#d62828;
}

.controls-box{
    background:white;
    border:1px solid #d7d7d7;
    border-radius:6px;
    padding:12px;
}

.control-group{
    margin-bottom:14px;
}

.control-group label{
    display:block;
    font-size:11px;
    font-weight:bold;
    margin-bottom:5px;
    text-transform:uppercase;
}

.monitor-select-row{
    display:flex;
    gap:6px;
}

select,
input{
    width:100%;
    padding:7px;
    box-sizing:border-box;
}

.monitor-arrow{
    width:28px;
    cursor:pointer;
}

canvas{
    width:100% !important;
    background:white !important;
}

.main-chart{
    height:170px !important;
}

.small-chart{
    height:240px !important;
}

.stats-box{
    padding:0 20px 20px;
}

.stats-table{
    width:100%;
    border-collapse:collapse;
    background:white;
    margin-top:10px;
}

.stats-table th{
    border:1px solid #2d4ea2;
    color:#1b2f7a;
    padding:8px;
    font-size:12px;
    background:#f2f4f8;
}

.stats-table td{
    border:1px solid #2d4ea2;
    padding:8px;
    text-align:center;
    font-size:12px;
}

.greyed{
    opacity:0.25;
}

</style>

</head>

<body>

<div class="header">
    Flow Survey Dashboard V20
</div>

<div id="dropZone">

    <div>
        Drag and Drop FDV and R Files Here
    </div>

    <div class="loading-box" id="loadingText"></div>

</div>

<div id="app">

    <div class="top-header">

        <button class="nav-btn" id="prevBtn">◀</button>

        <div id="monitorTitle"></div>

        <button class="nav-btn" id="nextBtn">▶</button>

    </div>

    <div class="dashboard-layout">

        <div class="left-panel">

            <div class="chart-box">
                <div class="chart-title">
                    Rainfall Intensity (mm/hr)
                </div>
                <canvas id="rainChart" class="main-chart"></canvas>
            </div>

            <div class="chart-box">
                <div class="chart-title">
                    Depth (mm)
                </div>
                <canvas id="depthChart" class="main-chart"></canvas>
            </div>

            <div class="chart-box">
                <div class="chart-title">
                    Flow (l/s)
                </div>
                <canvas id="flowChart" class="main-chart"></canvas>
            </div>

            <div class="chart-box">
                <div class="chart-title">
                    Velocity (m/s)
                </div>
                <canvas id="velocityChart" class="main-chart"></canvas>
            </div>

        </div>

        <div class="right-panel">

            <div class="controls-box">

                <div class="control-group">

                    <label>Select Monitor Station</label>

                    <div class="monitor-select-row">

                        <button class="monitor-arrow" id="leftMonitorBtn">◀</button>

                        <select id="monitorSelect"></select>

                        <button class="monitor-arrow" id="rightMonitorBtn">▶</button>

                    </div>

                </div>

                <div class="control-group">

                    <label>Size of the Monitored Pipe</label>

                    <input id="pipeSize" readonly>

                </div>

                <div class="control-group">

                    <label>Select Rain Gauge</label>

                    <select id="rainSelect"></select>

                </div>

            </div>

            <div class="chart-box">

                <div class="chart-title">
                    Cumulative Rainfall (mm)
                </div>

                <canvas id="cumulativeChart" class="small-chart"></canvas>

            </div>

            <div class="chart-box" id="scatterContainer">

                <div class="chart-title red-title" id="scatterTitle">
                    SCATTER GRAPH
                </div>

                <canvas id="scatterChart" class="small-chart"></canvas>

            </div>

        </div>

    </div>

    <div class="stats-box">

        <table class="stats-table">

            <thead>

                <tr>
                    <th>Time Range</th>
                    <th>Total Rainfall Depth (mm)</th>
                    <th>Total Flow Volume (m³)</th>
                </tr>

            </thead>

            <tbody>

                <tr>

                    <td id="timeRange"></td>
                    <td id="totalRain"></td>
                    <td id="totalVolume"></td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

<script>

const monitors = [];
const rainGauges = [];

let currentMonitorIndex = 0;

let rainChart;
let depthChart;
let flowChart;
let velocityChart;
let cumulativeChart;
let scatterChart;

Chart.defaults.animation = false;

function parseYYMMDDHHMM(str){

    const yy = parseInt(str.slice(0,2));
    const mm = parseInt(str.slice(2,4)) - 1;
    const dd = parseInt(str.slice(4,6));
    const hh = parseInt(str.slice(6,8));
    const mi = parseInt(str.slice(8,10));

    return new Date(2000 + yy, mm, dd, hh, mi);
}

function formatDate(date){

    return date.toLocaleDateString(
        'en-GB',
        {
            day:'2-digit',
            month:'short'
        }
    );
}

function formatDateTime(date){

    const pad = n => String(n).padStart(2,'0');

    return `${pad(date.getDate())}/${pad(date.getMonth()+1)}/${date.getFullYear()} `
        + `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
}

function generateTimeline(start, interval, count){

    const arr = [];

    for(let i=0;i<count;i++){

        arr.push(
            new Date(
                start.getTime()
                + i * interval * 60000
            )
        );
    }

    return arr;
}

function parseFDV(text){

    const lines =
        text.split(/\r?\n/);

    const identifier =
        text.match(/\b(FM|DM|RM)\d+\b/i)[0]
        .toUpperCase();

    const dateLine =
        lines.find(l =>
            /^\d{10}/.test(l.trim())
        );

    const parts =
        dateLine.trim().split(/\s+/);

    const start =
        parseYYMMDDHHMM(parts[0]);

    const interval =
        parseInt(parts[2]);

    const cendIndex =
        lines.findIndex(l =>
            l.toUpperCase().includes('CEND')
        );

    const nums =
        lines
        .slice(cendIndex + 1)
        .join(' ')
        .trim()
        .split(/\s+/)
        .map(Number);

    const flow = [];
    const depth = [];
    const velocity = [];

    for(let i=0;i<nums.length;i+=3){

        flow.push(nums[i] || 0);
        depth.push(nums[i+1] || 0);
        velocity.push(nums[i+2] || 0);
    }

    return {

        identifier,

        timestamps:
            generateTimeline(
                start,
                interval,
                depth.length
            ),

        flow,
        depth,
        velocity,

        interval,

        type:
            identifier.substring(0,2)
    };
}

function parseRain(text){

    const lines =
        text.split(/\r?\n/);

    const identifier =
        text.match(/\bRG\d+\b/i)[0]
        .toUpperCase();

    const dateLine =
        lines.find(l =>
            /^\d{10}/.test(l.trim())
        );

    const parts =
        dateLine.trim().split(/\s+/);

    const start =
        parseYYMMDDHHMM(parts[0]);

    const interval =
        parseInt(parts[2]);

    const cendIndex =
        lines.findIndex(l =>
            l.toUpperCase().includes('CEND')
        );

    const intensity =
        lines
        .slice(cendIndex + 1)
        .join(' ')
        .trim()
        .split(/\s+/)
        .map(Number);

    return {

        identifier,

        timestamps:
            generateTimeline(
                start,
                interval,
                intensity.length
            ),

        intensity
    };
}

function initializeCharts(){

    rainChart =
        new Chart(
            document.getElementById('rainChart'),
            {
                type:'line',
                data:{
                    labels:[],
                    datasets:[{
                        data:[],
                        borderColor:'#002b7f',
                        borderWidth:1.2,
                        pointRadius:0
                    }]
                },
                options:{
                    responsive:true,
                    maintainAspectRatio:false
                }
            }
        );
}

function renderDashboard(){

    const monitor =
        monitors[currentMonitorIndex];

    const labels =
        monitor.timestamps;

    rainChart.data.labels = labels;

    rainChart.data.datasets[0].data =
        monitor.depth;

    rainChart.update();

    document.getElementById('monitorTitle').innerText =
        monitor.identifier;

    document.getElementById('timeRange').innerText =
        `${formatDateTime(labels[0])} - ${formatDateTime(labels[labels.length-1])}`;
}

async function handleFiles(files){

    monitors.length = 0;
    rainGauges.length = 0;

    const loadingText =
        document.getElementById('loadingText');

    let processed = 0;

    for(const file of files){

        const text =
            await file.text();

        if(file.name.toLowerCase().endsWith('.fdv')){

            monitors.push(
                parseFDV(text)
            );
        }

        if(file.name.toLowerCase().endsWith('.r')){

            rainGauges.push(
                parseRain(text)
            );
        }

        processed++;

        loadingText.innerHTML =
            `Processing ${processed} / ${files.length}`;
    }

    if(monitors.length === 0){

        alert('No FDV files detected');

        return;
    }

    initializeCharts();

    document.getElementById('dropZone').style.display='none';

    document.getElementById('app').style.display='block';

    renderDashboard();
}

// DRAG DROP FIX

const dropZone =
    document.getElementById('dropZone');

['dragenter','dragover'].forEach(eventName=>{

    dropZone.addEventListener(
        eventName,
        e=>{

            e.preventDefault();
            e.stopPropagation();

            dropZone.classList.add('dragover');
        },
        false
    );
});

['dragleave','drop'].forEach(eventName=>{

    dropZone.addEventListener(
        eventName,
        e=>{

            e.preventDefault();
            e.stopPropagation();

            dropZone.classList.remove('dragover');
        },
        false
    );
});

dropZone.addEventListener(
    'drop',
    e=>{

        const dt =
            e.dataTransfer;

        const files =
            dt.files;

        handleFiles(files);
    },
    false
);

</script>

</body>
</html>
