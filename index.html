<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flow Survey Data Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #f8fafc; }
        .sidebar { width: 280px; background: #0f172a; color: white; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; background: #020617; border-bottom: 1px solid #1e293b; }
        .sidebar-header h2 { font-size: 14px; margin: 0; color: #38bdf8; }
        .file-list { flex: 1; overflow-y: auto; padding: 15px; }
        .list-section-title { font-size: 11px; color: #64748b; margin: 15px 0 5px; text-transform: uppercase; }
        .station-item { padding: 10px; background: #1e293b; margin-bottom: 5px; cursor: pointer; border-radius: 4px; font-size: 13px; }
        .station-item.active { background: #22c55e; }
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .upload-zone { border: 2px dashed #38bdf8; padding: 40px; margin: 20px; text-align: center; cursor: pointer; background: white; }
        .workspace { display: none; padding: 20px; }
        .graph-pane { background: white; padding: 15px; margin-bottom: 20px; border: 1px solid #e2e8f0; height: 250px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; font-size: 12px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header"><h2>Flow Survey Data Viewer</h2></div>
    <div class="file-list">
        <div class="list-section-title">Select Monitor</div>
        <div id="fdvListContainer"></div>
        <div class="list-section-title">Rainfall Sources</div>
        <div id="rainInventoryContainer"></div>
    </div>
</div>

<div class="main-content">
    <div id="dropZone" class="upload-zone">
        <input type="file" id="fileInput" multiple style="display:none">
        <p>Drop files here or click to select</p>
    </div>
    <div id="workspace" class="workspace">
        <div class="graph-pane"><h3>Rainfall Intensity (mm/hr)</h3><canvas id="rainChart"></canvas></div>
        <div class="graph-pane"><h3>Cumulative Rainfall (mm)</h3><canvas id="cumulativeChart"></canvas></div>
        <div id="statsArea"></div>
    </div>
</div>

<script>
    // 1. STOP BROWSER FROM OPENING FILES IN NEW TABS
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
        window.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }, false);
    });

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => handleFiles(e.target.files));
    dropZone.addEventListener('drop', e => handleFiles(e.dataTransfer.files));

    function handleFiles(files) {
        document.getElementById('dropZone').style.display = 'none';
        document.getElementById('workspace').style.display = 'block';

        for (let file of files) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const text = e.target.result;
                const fileName = file.name;
                
                if (fileName.toLowerCase().endsWith('.r')) {
                    processRainfall(text, fileName);
                } else {
                    processFdv(text, fileName);
                }
            };
            reader.readAsText(file);
        }
    }

    function processRainfall(text, name) {
        // Assume 2 minute interval as default
        const intervalHours = 2 / 60; 
        const lines = text.split(/\r?\n/);
        let intensities = []; 
        let inData = false;

        lines.forEach(line => {
            if (line.startsWith('*CEND')) inData = true;
            else if (inData) {
                line.split(/\s+/).forEach(val => {
                    let v = parseFloat(val);
                    if (!isNaN(v)) intensities.push(v);
                });
            }
        });

        // CONVERSION: Intensity (mm/hr) * hours = Depth (mm)
        const depths = intensities.map(i => i * intervalHours);
        const cumulative = [];
        let running = 0;
        depths.forEach(d => { running += d; cumulative.push(running); });

        // Update UI logic goes here (Charts/Tables)
        console.log("Rainfall data parsed for:", name);
    }

    function processFdv(text, name) {
        // Clean name by removing extension
        const cleanName = name.replace(/\.[fF][dD][vV]$/, '');
        const div = document.createElement('div');
        div.className = 'station-item';
        div.textContent = cleanName;
        document.getElementById('fdvListContainer').appendChild(div);
    }
</script>
</body>
</html>
