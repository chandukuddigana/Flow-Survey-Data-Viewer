<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Survey Data Viewer</title>
    <!-- Include SheetJS for Excel files -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Include PapaParse for FDV/CSV text files -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 30px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; }
        .upload-zone { border: 2px dashed #ccc; padding: 30px; text-align: center; background: #f9f9f9; border-radius: 8px; margin-bottom: 20px; }
        .upload-zone:hover { border-color: #0066cc; background: #f0f7ff; }
        #fileInput { display: none; }
        .btn { background: #0066cc; color: white; padding: 10px 20px; border-radius: 5px; cursor: pointer; display: inline-block; font-weight: bold; }
        .status { margin-top: 10px; color: #666; font-style: italic; }
        .table-container { overflow-x: auto; margin-top: 20px; border: 1px solid #e0e0e0; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background-color: #f4f4f4; padding: 12px; border-bottom: 2px solid #ddd; position: sticky; top: 0; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        tr:hover { background-color: #fcfcfc; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Flow Survey Data Viewer</h2>
        <p>Upload your Excel (.xlsx, .xls) or Flow Survey (.fdv) files to view the raw data instantly.</p>
        
        <div class="upload-zone" id="dropZone">
            <label for="fileInput" class="btn">Select File</label>
            <input type="file" id="fileInput" accept=".xlsx, .xls, .fdv, .txt, .csv">
            <p>or drag and drop your file here</p>
            <div id="status" class="status">Ready for file...</div>
        </div>

        <div class="table-container">
            <table id="dataTable">
                <thead><tr id="tableHeader"></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const statusDiv = document.getElementById('status');

        // Handle file selection
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        // Drag and drop handlers
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#0066cc'; });
        dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#ccc'; });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#ccc';
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (!file) return;
            statusDiv.textContent = `Processing: ${file.name}...`;
            const extension = file.name.split('.').pop().toLowerCase();

            if (extension === 'xlsx' || extension === 'xls') {
                parseExcel(file);
            } else {
                // Treat .fdv, .csv, or .txt as text data
                parseText(file);
            }
        }

        function parseExcel(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                // Target the first sheet in the workbook
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                // Convert to array of arrays
                const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                renderTable(jsonData);
            };
            reader.readAsArrayBuffer(file);
        }

        function parseText(file) {
            Papa.parse(file, {
                complete: function(results) {
                    renderTable(results.data);
                },
                dynamicTyping: true,
                skipEmptyLines: true
            });
        }

        function renderTable(data) {
            const headerRow = document.getElementById('tableHeader');
            const bodyContainer = document.getElementById('tableBody');
            
            // Clear previous data
            headerRow.innerHTML = '';
            bodyContainer.innerHTML = '';

            if (!data || data.length === 0) {
                statusDiv.textContent = "Error: File appears to be empty.";
                return;
            }

            // Generate Headers (Row 0)
            const headers = data[0];
            headers.forEach(headerText => {
                const th = document.createElement('th');
                th.textContent = headerText !== undefined ? headerText : '';
                headerRow.appendChild(th);
            });

            // Generate Data Rows
            for (let i = 1; i < data.length; i++) {
                const rowData = data[i];
                // Skip completely empty rows
                if (rowData.every(cell => cell === null || cell === '')) continue;

                const tr = document.createElement('tr');
                // Ensure row displays columns matching the header length
                for (let j = 0; j < headers.length; j++) {
                    const td = document.createElement('td');
                    td.textContent = rowData[j] !== undefined ? rowData[j] : '';
                    tr.appendChild(td);
                }
                bodyContainer.appendChild(tr);
            }
            statusDiv.textContent = `Successfully loaded ${data.length - 1} rows.`;
        }
    </script>
</body>
</html>
