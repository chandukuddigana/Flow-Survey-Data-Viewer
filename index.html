<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICM FDV Native Multi-Pane Chart Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; color: #222; background-color: #f7f9fa; }
        .container { max-width: 1300px; margin: 0 auto; }
        .upload-zone { border: 2px dashed #0052cc; padding: 25px; text-align: center; background: #fff; border-radius: 6px; margin-bottom: 20px; transition: 0.2s; }
        .upload-zone:hover { border-color: #0022aa; background: #fafafa; }
        #fileInput { display: none; }
        .btn { background: #0052cc; color: white; padding: 12px 24px; border-radius: 4px; cursor: pointer; display: inline-block; font-weight: bold; font-size: 14px; }
        .btn:hover { background: #0040a3; }
        .status { margin-top: 12px; color: #555; font-size: 14px; font-weight: 500; }
        
        .dashboard { display: none; margin-top: 25px; }
        .graph-pane { background: #fff; padding: 18px; border: 1px solid #dcdcdc; border-radius: 4px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); height: 250px; position: relative; }
        h3 { margin: 0 0 12px 0; font-size: 13px; color: #0033aa; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #f0f2f5; padding-bottom: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Flow Survey Graphing Interface <span style="font-size:14px; font-weight:normal; color:#666;">(Native .FDV Text Stream Parser)</span></h2>
        
        <div class="upload-zone" id="dropZone">
            <label for="fileInput" class="btn">Select Native FDV File</label>
            <input type="file" id="fileInput" accept=".fdv,.txt">
            <p style="margin: 10px 0 0 0; color: #666; font-size: 13px;">Drag & drop your native telemetry or model export file here</p>
            <div id="status" class="status">Awaiting data format package submission...</div>
        </div>

        <div class="dashboard" id="dashboard">
            <div class="graph-pane">
                <h3>Flow Profile (L/S)</h3>
                <canvas id="flowChart"></canvas>
            </div>
            <div class="graph-pane">
                <h3>Depth Profile (MM)</h3>
                <canvas id="depthChart"></canvas>
            </div>
            <div class="graph-pane">
                <h3>Velocity Profile (M/S)</h3>
                <canvas id="velocityChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const statusDiv = document.getElementById('status');
        const dashboard = document.getElementById('dashboard');
        
        let charts = { flow: null, depth: null, velocity: null };

        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.background = '#f0f5ff'; });
        dropZone.addEventListener('dragleave', () => { dropZone.style.background = '#fff'; });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.background = '#fff';
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (!file) return;
            statusDiv.textContent = `Reading data blocks from "${file.name}"...`;
            dashboard.style.display = 'none';

            const reader = new FileReader();
            reader.onload = function(e) {
                parseNativeFDV(e.target.result);
            };
            reader.readAsText(file);
        }

        function parseNativeFDV(text) {
            const lines = text.split(/\r?\n/);
            
            let startTimeStr = "";
            let intervalMinutes = 2; // Default template fallback
            let inDataSection = false;
            let rawValuesArray = [];

            // Step 1: Scan and isolate tracking structural components
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                if (line.startsWith('*CSTART')) {
                    // Look at the next few initialization parameter rows
                    let paramLine1 = lines[i+1] ? lines[i+1].trim() : "";
                    let paramLine2 = lines[i+2] ? lines[i+2].trim() : "";
                    
                    // Pull initialization parameters from metadata
                    let match = paramLine2.match(/^(\d{10})\s+\d{10}\s+(\d+)/);
                    if (match) {
                        startTimeStr = match[1]; // e.g., 2503071110
                        intervalMinutes = parseInt(match[2]); // e.g., 2
                    }
                }
                
                if (line.startsWith('*CEND')) {
                    inDataSection = true;
                    continue;
                }

                // If inside data block, convert layout into numeric sequences
                if (inDataSection) {
                    let segments = line.split(/\s+/);
                    segments.forEach(token => {
                        let val = parseFloat(token);
                        if (!isNaN(val)) {
                            rawValuesArray.push(val);
                        }
                    });
                }
            }

            // Step 2: Ensure data parsing safety
            if (rawValuesArray.length < 3) {
                statusDiv.textContent = "Error: Found metadata, but failed to reconstruct valid data channels.";
                return;
            }

            // Step 3: Parse dates from YYMMDDHHMM strings
            let baseDate = new Date();
            if (startTimeStr.length === 10) {
                let yy = parseInt("20" + startTimeStr.substring(0,2));
                let mm = parseInt(startTimeStr.substring(2,4)) - 1;
                let dd = parseInt(startTimeStr.substring(4,6));
                let hh = parseInt(startTimeStr.substring(6,8));
                let min = parseInt(startTimeStr.substring(8,10));
                baseDate = new Date(yy, mm, dd, hh, min);
            }

            // Step 4: Map values sequentially into distinct channel buckets
            const timeLabels = [];
            const flowData = [];
            const depthData = [];
            const velocityData = [];

            let stepCount = 0;
            // Iterate in steps of 3 (Flow, Depth, Velocity matrix layout)
            for (let j = 0; j < rawValuesArray.length; j += 3) {
                if (j + 2 >= rawValuesArray.length) break; 

                // Generate incremental timestamp label
                let currentStepTime = new Date(baseDate.getTime() + (stepCount * intervalMinutes * 60 * 1000));
                let timeStampLabel = currentStepTime.toLocaleDateString('en-GB', {day:'2-digit', month:'2-digit'}) + ' ' + 
                                     currentStepTime.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
                
                timeLabels.push(timeStampLabel);
                flowData.push(rawValuesArray[j]);       // Flow data array index
                depthData.push(rawValuesArray[j+1]);    // Depth data array index
                velocityData.push(rawValuesArray[j+2]); // Velocity data array index
                
                stepCount++;
            }

            statusDiv.textContent = `Parsed ${stepCount} steps successfully! Displaying 3-axis stacked telemetry window.`;
            dashboard.style.display = 'block';

            // Step 5: Render individual canvas rows
            renderPane('flowChart', timeLabels, flowData, 'Flow (L/S)', '#9b59b6', 'rgba(155, 89, 182, 0.04)', 'flow');
            renderPane('depthChart', timeLabels, depthData, 'Depth (MM)', '#2980b9', 'rgba(41, 128, 185, 0.04)', 'depth');
            renderPane('velocityChart', timeLabels, velocityData, 'Velocity (M/S)', '#27ae60', 'rgba(39, 174, 96, 0.04)', 'velocity');
        }

        function renderPane(canvasId, labels, data, labelTitle, primaryColor, fillBG, key) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            
            if (charts[key]) {
                charts[key].destroy();
            }

            charts[key] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        borderColor: primaryColor,
                        backgroundColor: fillBG,
                        borderWidth: 1.5,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        fill: true,
                        tension: 0.02
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { maxTicksLimit: 12, color: '#666', font: { size: 10 } }
                        },
                        y: {
                            grid: { color: '#eaeded' },
                            ticks: { color: '#444', font: { size: 11 } },
                            title: { display: true, text: labelTitle, font: { weight: 'bold', size: 11 } }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: { mode: 'index', intersect: false }
                    }
                }
            });
        }
    </script>
</body>
</html>
