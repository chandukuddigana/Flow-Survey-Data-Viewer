<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Flow & Rainfall Workspace</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; color: #222; background-color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; border-right: 1px solid #1e293b; }
        .sidebar-header { padding: 20px; background: #020617; border-bottom: 1px solid #1e293b; }
        .sidebar-header h2 { margin: 0; font-size: 15px; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; }
        .file-list { flex: 1; overflow-y: auto; padding: 15px 10px; }
        .station-item { padding: 12px; margin-bottom: 8px; border-radius: 6px; background: #1e293b; cursor: pointer; font-size: 13px; border: 1px solid #334155; }
        .station-item.active { background: #0284c7; border-color: #0ea5e9; color: #fff; font-weight: bold; }
        .indicator-badges { display: flex; gap: 5px; margin-top: 6px; font-size: 10px; }
        .badge { padding: 2px 6px; border-radius: 4px; font-weight: bold; background: #475569; color: #cbd5e1; }
        .badge.active-fdv { background: #c084fc; color: #581c87; }
        .badge.active-rain { background: #4ade80; color: #14532d; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; height: 100%; }
        .top-banner { background: #fff; padding: 15px 30px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .top-banner h1 { margin: 0; font-size: 18px; color: #0f172a; }
        .upload-zone { border: 2px dashed #38bdf8; padding: 25px; text-align: center; background: #fff; border-radius: 8px; margin: 25px; cursor: pointer; }
        .btn { background: #0284c7; color: white; padding: 10px 20px; border-radius: 4px; cursor: pointer; display: inline-block; font-weight: bold; font-size: 13px; }
        .workspace-view { display: none; padding: 0 25px 25px 25px; }
        .graph-pane { background: #fff; padding: 15px; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 15px; height: 190px; position: relative; }
        .graph-pane.rain-pane { border-top: 4px solid #22c55e; background: #f0fdf4; height: 145px; }
        h3 { margin: 0 0 8px 0; font-size: 11px; color: #475569; text-transform: uppercase; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px; }
        .rain-pane h3 { color: #15803d; }
        .status-msg { font-size: 12px; color: #64748b; font-weight: 500; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Hydraulic Station Index</h2>
        </div>
        <div class="file-list" id="stationList">
            <div style="color: #64748b; font-size: 12px; padding: 10px; font-style: italic; text-align: center;">No stations populated yet.</div>
        </div>
    </div>

    <div class="main-content">
        <div class="top-banner">
            <h1 id="activeViewTitle">Awaiting Station Packages</h1>
            <div class="status-msg" id="linkStatus">Upload Files Below</div>
        </div>
        
        <div class="upload-zone" id="dropZone">
            <div class="btn" id="pickerBtn">Click to Select Files</div>
            <input type="file" id="fileInput" multiple style="display:none;">
            <p style="margin: 8px 0 0 0; color: #64748b; font-size: 13px;">Or drag your <b>.FDV</b> and <b>.R</b> files together directly here</p>
            <div id="status" style="margin-top: 10px; font-size: 13px; color: #0284c7; font-weight: bold;">Ready for files...</div>
        </div>

        <div class="workspace-view" id="workspaceView">
            <div class="graph-pane rain-pane" id="rainPane">
                <h3>Precipitation Inflow Hyetograph (MM)</h3>
                <canvas id="rainChart"></canvas>
            </div>
            <div class="graph-pane">
                <h3>Calcul
