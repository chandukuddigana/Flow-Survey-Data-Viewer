// Add this at the very top of your <script> section
const preventDefaults = (e) => {
    e.preventDefault();
    e.stopPropagation();
};

// Properly attach to window and dropZone to stop browser "open in new tab" behavior
['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    window.addEventListener(eventName, preventDefaults, false);
    document.getElementById('dropZone').addEventListener(eventName, preventDefaults, false);
});

// Update your drop listener to ensure it processes the data
document.getElementById('dropZone').addEventListener('drop', (e) => {
    const dt = e.dataTransfer;
    const files = dt.files;
    if (files && files.length > 0) {
        handleFiles(files); // This calls your existing processing function
    }
});
