<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flow Survey Data Viewer</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f7fb;
    color:#1e293b;
}

.topbar{
    background:white;
    padding:14px 24px;
    border-bottom:1px solid #dbe3ec;
    font-size:20px;
    font-weight:bold;
}

.upload-zone{
    margin:20px;
    padding:40px;
    border:2px dashed #3b82f6;
    background:white;
    border-radius:8px;
    text-align:center;
    cursor:pointer;
}

.upload-zone:hover{
    background:#eff6ff;
}

#fileInput{
    display:none;
}

.workspace{
    display:none;
    padding:20px;
}

.chart-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:18px;
}

.chart-box{
    background:white;
    border-radius:8px;
    border:1px solid #dbe3ec;
    padding:14px;
}

.chart-box h3{
    margin-top:0;
    font-size:13px;
    text-transform:uppercase;
    color:#334155;
}

.controls{
    display:flex;
    gap:12px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

select{
    padding:8px 12px;
    border-radius:6px;
    border:1px solid #cbd5e1;
    min-width:220px;
}

.status{
    margin-top:12px;
    color:#2563eb;
    font-weight:bold;
}

.info-panel{
    margin-top:20px;
    background:white;
    border:1px solid #dbe3ec;
    border-radius:8px;
    padding:16px;
}

.info-row{
    margin-bottom:8px;
}

</style>
</head>

<body>

<div class="topbar">
    Flow Survey Data Viewer
</div>

<div class="upload-zone" id="dropZone">

    <input type="file" id="fileInput" multiple>

    <div style="font-size:18px;font-weight:bold;">
        Click or Drag Files Here
    </div>

    <div style="margin-top:10px;">
        Upload .FDV and .R files
    </div>

    <div class="status" id="status">
        Ready...
    </div>

</div>

<div class="workspace" id="workspace">

    <div class="controls">

        <select id="monitorSelector">
            <option value="">Select Monitor</option>
        </select>

        <select id="rainSelector">
            <option value="">Select Rain Gauge</option>
        </select>

    </div>

    <div class="chart-grid">

        <div class="chart-box">
            <h3>Rainfall Intensity (mm/hr)</h3>
            <canvas id="rainChart"></canvas>
        </div>

        <div class="chart-box">
            <h3>Cumulative Rainfall (mm)</h3>
            <canvas id="cumulativeChart"></canvas>
        </div>

        <div class="chart-box">
            <h3>Depth (mm)</h3>
            <canvas id="depthChart"></canvas>
        </div>

        <div class="chart-box">
            <h3>Flow (L/s)</h3>
            <canvas id="flowChart"></canvas>
        </div>

        <div class="chart-box">
            <h3>Velocity (m/s)</h3>
            <canvas id="velocityChart"></canvas>
        </div>

    </div>

    <div class="info-panel">

        <div class="info-row">
            <b>FDV Start:</b>
            <span id="fdvStart"></span>
        </div>

        <div class="info-row">
            <b>FDV End:</b>
            <span id="fdvEnd"></span>
        </div>

        <div class="info-row">
            <b>Pipe Size:</b>
            <span id="pipeSize"></span>
        </div>

    </div>

</div>

<script>

/* ============================================================
   GLOBAL DATABASES
============================================================ */

let fdvDatabase = {};
let rainDatabase = {};

let charts = {
    rain:null,
    cumulative:null,
    depth:null,
    flow:null,
    velocity:null
};

const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');

const workspace = document.getElementById('workspace');

const statusDiv = document.getElementById('status');

const monitorSelector =
    document.getElementById('monitorSelector');

const rainSelector =
    document.getElementById('rainSelector');

/* ============================================================
   FILE INPUT
============================================================ */

dropZone.addEventListener('click', () => {
    fileInput.click();
});

fileInput.addEventListener('change', (e) => {
    handleFiles(e.target.files);
});

dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
});

dropZone.addEventListener('drop', (e) => {

    e.preventDefault();

    handleFiles(e.dataTransfer.files);
});

/* ============================================================
   DATE PARSER
============================================================ */

function parseTelemetryDate(rawDateStr){

    const clean = rawDateStr.trim();

    if(clean.length !== 10){
        return null;
    }

    const yy =
        parseInt(clean.slice(0,2));

    const mm =
        parseInt(clean.slice(2,4)) - 1;

    const dd =
        parseInt(clean.slice(4,6));

    const hh =
        parseInt(clean.slice(6,8));

    const mi =
        parseInt(clean.slice(8,10));

    const fullYear =
        yy >= 70
        ? 1900 + yy
        : 2000 + yy;

    return new Date(
        fullYear,
        mm,
        dd,
        hh,
        mi
    );
}

/* ============================================================
   DATE FORMATTER
============================================================ */

function formatDate(date){

    const y = date.getFullYear();

    const m =
        String(date.getMonth()+1)
        .padStart(2,'0');

    const d =
        String(date.getDate())
        .padStart(2,'0');

    const h =
        String(date.getHours())
        .padStart(2,'0');

    const mi =
        String(date.getMinutes())
        .padStart(2,'0');

    return `${y}-${m}-${d} ${h}:${mi}`;
}

/* ============================================================
   RAIN FILE PARSER
============================================================ */

function processRainFile(contentText, fileName){

    const lines =
        contentText.split(/\r?\n/);

    let startDate = null;
    let endDate = null;
    let intervalMinutes = 2;

    let insideConstants = false;
    let insideData = false;

    let values = [];

    for(let line of lines){

        const clean = line.trim();

        if(clean.includes('*CSTART')){
            insideConstants = true;
            continue;
        }

        if(clean.includes('*CEND')){
            insideConstants = false;
            insideData = true;
            continue;
        }

        if(insideConstants){

            const match =
                clean.match(
                    /(\d{10})\s+(\d{10})\s+(\d+)/
                );

            if(match){

                startDate =
                    parseTelemetryDate(match[1]);

                endDate =
                    parseTelemetryDate(match[2]);

                intervalMinutes =
                    parseInt(match[3]);
            }
        }

        else if(insideData){

            const nums =
                clean.match(/-?\d+\.?\d*/g);

            if(nums){

                nums.forEach(n => {
                    values.push(parseFloat(n));
                });
            }
        }
    }

    const timestamps = [];

    const intervalMs =
        intervalMinutes * 60 * 1000;

    for(let i=0;i<values.length;i++){

        timestamps.push(
            new Date(
                startDate.getTime() +
                i * intervalMs
            )
        );
    }

    let cumulative = [];

    let running = 0;

    values.forEach(v => {

        running +=
            (v * intervalMinutes) / 60;

        cumulative.push(running);
    });

    return {

        fileName,

        timestamps,

        intensity:values,

        cumulative,

        intervalMinutes
    };
}

/* ============================================================
   FDV FILE PARSER
============================================================ */

function processFdvFile(contentText, fileName){

    const lines =
        contentText.split(/\r?\n/);

    let timestamps = [];
    let depth = [];
    let flow = [];
    let velocity = [];

    let pipeSize = 'Unknown';

    for(let line of lines){

        const clean = line.trim();

        const match =
            clean.match(
                /^(\d{10})\s+(-?\d+\.?\d*)\s+(-?\d+\.?\d*)\s+(-?\d+\.?\d*)/
            );

        if(match){

            timestamps.push(
                parseTelemetryDate(match[1])
            );

            depth.push(parseFloat(match[2]));

            flow.push(parseFloat(match[3]));

            velocity.push(parseFloat(match[4]));
        }

        if(
            clean.toUpperCase().includes('PIPE')
        ){
            pipeSize = clean;
        }
    }

    let intervalMinutes = 2;

    if(timestamps.length >= 2){

        intervalMinutes =
            (
                timestamps[1] -
                timestamps[0]
            ) / (60 * 1000);
    }

    return {

        fileName,

        timestamps,

        depth,

        flow,

        velocity,

        intervalMinutes,

        pipeSize
    };
}

/* ============================================================
   RAINFALL SYNCHRONIZATION
============================================================ */

function synchronizeRainfallToFdv(
    fdvData,
    rainData
){

    const fdvStart =
        fdvData.timestamps[0].getTime();

    const fdvEnd =
        fdvData.timestamps[
            fdvData.timestamps.length - 1
        ].getTime();

    const intervalMs =
        fdvData.intervalMinutes *
        60 *
        1000;

    const rainMap = new Map();

    for(let i=0;i<rainData.timestamps.length;i++){

        rainMap.set(

            rainData.timestamps[i].getTime(),

            rainData.intensity[i]
        );
    }

    let syncedTimestamps = [];
    let syncedIntensity = [];
    let syncedCumulative = [];

    let cumulative = 0;

    for(
        let t = fdvStart;
        t <= fdvEnd;
        t += intervalMs
    ){

        syncedTimestamps.push(
            new Date(t)
        );

        const val =
            rainMap.has(t)
            ? rainMap.get(t)
            : 0;

        syncedIntensity.push(val);

        cumulative +=
            (val * fdvData.intervalMinutes) / 60;

        syncedCumulative.push(cumulative);
    }

    return {

        ...rainData,

        timestamps:syncedTimestamps,

        intensity:syncedIntensity,

        cumulative:syncedCumulative
    };
}

/* ============================================================
   FILE HANDLER
============================================================ */

function handleFiles(files){

    fdvDatabase = {};
    rainDatabase = {};

    let processed = 0;

    statusDiv.innerText =
        'Processing files...';

    for(let file of files){

        const reader = new FileReader();

        reader.onload = function(e){

            const text = e.target.result;

            const upper =
                file.name.toUpperCase();

            if(
                upper.endsWith('.R') ||
                text.includes('INTENSITY')
            ){

                const rain =
                    processRainFile(
                        text,
                        file.name
                    );

                rainDatabase[file.name] = rain;
            }

            else {

                const fdv =
                    processFdvFile(
                        text,
                        file.name
                    );

                fdvDatabase[file.name] = fdv;
            }

            processed++;

            if(processed === files.length){

                finalizeData();
            }
        };

        reader.readAsText(file);
    }
}

/* ============================================================
   FINALIZE
============================================================ */

function finalizeData(){

    const fdvKeys =
        Object.keys(fdvDatabase);

    const rainKeys =
        Object.keys(rainDatabase);

    monitorSelector.innerHTML = '';
    rainSelector.innerHTML = '';

    fdvKeys.forEach(key => {

        const opt =
            document.createElement('option');

        opt.value = key;
        opt.textContent = key;

        monitorSelector.appendChild(opt);
    });

    rainKeys.forEach(key => {

        const opt =
            document.createElement('option');

        opt.value = key;
        opt.textContent = key;

        rainSelector.appendChild(opt);
    });

    if(fdvKeys.length && rainKeys.length){

        const fdv =
            fdvDatabase[fdvKeys[0]];

        const rain =
            rainDatabase[rainKeys[0]];

        rainDatabase[rainKeys[0]] =
            synchronizeRainfallToFdv(
                fdv,
                rain
            );
    }

    workspace.style.display = 'block';

    statusDiv.innerText =
        'Files loaded successfully';

    renderCharts();
}

/* ============================================================
   RENDER CHARTS
============================================================ */

function renderCharts(){

    const fdvKey =
        monitorSelector.value ||
        Object.keys(fdvDatabase)[0];

    const rainKey =
        rainSelector.value ||
        Object.keys(rainDatabase)[0];

    const fdv =
        fdvDatabase[fdvKey];

    const rain =
        rainDatabase[rainKey];

    if(!fdv || !rain){
        return;
    }

    document.getElementById('fdvStart')
        .innerText =
        formatDate(fdv.timestamps[0]);

    document.getElementById('fdvEnd')
        .innerText =
        formatDate(
            fdv.timestamps[
                fdv.timestamps.length - 1
            ]
        );

    document.getElementById('pipeSize')
        .innerText =
        fdv.pipeSize;

    const labels =
        fdv.timestamps.map(formatDate);

    createChart(
        'rainChart',
        'bar',
        labels,
        rain.intensity,
        'Rainfall'
    );

    createChart(
        'cumulativeChart',
        'line',
        labels,
        rain.cumulative,
        'Cumulative'
    );

    createChart(
        'depthChart',
        'line',
        labels,
        fdv.depth,
        'Depth'
    );

    createChart(
        'flowChart',
        'line',
        labels,
        fdv.flow,
        'Flow'
    );

    createChart(
        'velocityChart',
        'line',
        labels,
        fdv.velocity,
        'Velocity'
    );
}

/* ============================================================
   CHART CREATOR
============================================================ */

function createChart(
    canvasId,
    type,
    labels,
    data,
    label
){

    if(charts[canvasId]){
        charts[canvasId].destroy();
    }

    const ctx =
        document
        .getElementById(canvasId)
        .getContext('2d');

    charts[canvasId] =
        new Chart(ctx, {

            type,

            data:{

                labels,

                datasets:[{

                    label,

                    data,

                    borderWidth:1
                }]
            },

            options:{

                responsive:true,

                maintainAspectRatio:false,

                scales:{
                    x:{
                        ticks:{
                            maxTicksLimit:10
                        }
                    }
                }
            }
        });
}

/* ============================================================
   SELECTOR EVENTS
============================================================ */

monitorSelector.addEventListener(
    'change',
    renderCharts
);

rainSelector.addEventListener(
    'change',
    renderCharts
);

</script>

</body>
</html>
