<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flow Survey Dashboard V2</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    color:#222;
}

.header{
    background:#1f2937;
    color:white;
    padding:16px 24px;
    font-size:24px;
    font-weight:bold;
}

#dropZone{
    margin:20px;
    border:3px dashed #999;
    border-radius:10px;
    background:white;
    padding:60px;
    text-align:center;
    font-size:20px;
    transition:0.3s;
}

#dropZone.dragover{
    background:#eef6ff;
    border-color:#1e88e5;
}

.controls{
    display:flex;
    gap:20px;
    padding:10px 20px;
    flex-wrap:wrap;
    align-items:end;
}

.control-box{
    display:flex;
    flex-direction:column;
}

label{
    font-size:13px;
    margin-bottom:5px;
    font-weight:bold;
}

select,
input{
    padding:8px;
    min-width:220px;
}

.monitor-header{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin-top:10px;
    font-size:26px;
    font-weight:bold;
}

.nav-btn{
    border:none;
    background:#1f2937;
    color:white;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}

.dashboard{
    padding:10px 20px 30px;
}

.chart-container{
    background:white;
    border-radius:10px;
    padding:10px;
    margin-bottom:20px;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
}

.main-grid{
    display:grid;
    grid-template-columns:3fr 1fr;
    gap:20px;
}

.side-grid{
    display:flex;
    flex-direction:column;
    gap:20px;
}

canvas{
    width:100% !important;
    height:340px !important;
}

.small-chart canvas{
    height:260px !important;
}

.stats-table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

.stats-table th{
    background:#1f2937;
    color:white;
    padding:10px;
    border:1px solid #ccc;
}

.stats-table td{
    padding:10px;
    text-align:center;
    border:1px solid #ccc;
}

.greyed{
    opacity:0.3;
}

</style>

</head>

<body>

<div class="header">
    Flow Survey Dashboard V2
</div>

<div id="dropZone">
    Drag and Drop FDV and R Files Here
</div>

<div id="app" style="display:none;">

    <div class="controls">

        <div class="control-box">
            <label>Select the Monitor</label>
            <select id="monitorSelect"></select>
        </div>

        <div class="control-box">
            <label>Size of the Monitored Pipe</label>
            <input id="pipeSize" readonly>
        </div>

        <div class="control-box">
            <label>Select the Rain Gauge</label>
            <select id="rainSelect"></select>
        </div>

    </div>

    <div class="monitor-header">

        <button class="nav-btn" id="prevBtn">◀</button>

        <div id="monitorTitle">Monitor</div>

        <button class="nav-btn" id="nextBtn">▶</button>

    </div>

    <div class="dashboard">

        <div class="chart-container">
            <canvas id="mainChart"></canvas>
        </div>

        <div class="main-grid">

            <div class="chart-container small-chart">
                <canvas id="scatterChart"></canvas>
            </div>

            <div class="side-grid">

                <div class="chart-container small-chart">
                    <canvas id="cumulativeChart"></canvas>
                </div>

            </div>

        </div>

        <div class="chart-container">

            <table class="stats-table">

                <thead>

                    <tr>
                        <th>Time Range</th>
                        <th>Total Rainfall Depth (mm)</th>
                        <th>Rainfall (mm/hr)</th>
                        <th>Depth (mm)</th>
                        <th>Flow (l/s)</th>
                        <th>Velocity (m/s)</th>
                        <th>Total Flow Volume (m³)</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>

                        <td id="timeRange"></td>
                        <td id="totalRain"></td>
                        <td id="maxRain"></td>
                        <td id="maxDepth"></td>
                        <td id="maxFlow"></td>
                        <td id="maxVelocity"></td>
                        <td id="totalVolume"></td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

// =====================================================
// GLOBAL DRAG DROP PROTECTION
// =====================================================

window.addEventListener('dragover', function(e){
    e.preventDefault();
});

window.addEventListener('drop', function(e){
    e.preventDefault();
});

// =====================================================
// GLOBAL STORAGE
// =====================================================

const monitors = [];
const rainGauges = [];

let currentMonitorIndex = 0;

let mainChart;
let scatterChart;
let cumulativeChart;

// =====================================================
// DATE PARSER
// =====================================================

function parseYYMMDDHHMM(str){

    const yy = parseInt(str.slice(0,2));
    const mm = parseInt(str.slice(2,4)) - 1;
    const dd = parseInt(str.slice(4,6));
    const hh = parseInt(str.slice(6,8));
    const mi = parseInt(str.slice(8,10));

    return new Date(2000 + yy, mm, dd, hh, mi);
}

// =====================================================
// DATE FORMATTER
// =====================================================

function formatDate(date){

    return date.toLocaleDateString('en-GB',{
        day:'2-digit',
        month:'short'
    });
}

// =====================================================
// TIMELINE GENERATOR
// =====================================================

function generateTimeline(start, interval, count){

    const arr = [];

    for(let i=0;i<count;i++){

        arr.push(
            new Date(start.getTime() + i * interval * 60000)
        );
    }

    return arr;
}

// =====================================================
// FDV PARSER
// =====================================================

function parseFDV(text){

    const lines = text.split(/\r?\n/);

    const identifierMatch =
        text.match(/\b(FM|DM|RM)\d+\b/i);

    if(!identifierMatch){

        throw new Error(
            'Unable to detect monitor identifier'
        );
    }

    const identifier =
        identifierMatch[0].toUpperCase();

    const dateLine =
        lines.find(l => /^\d{10}/.test(l.trim()));

    if(!dateLine){

        throw new Error(
            'Unable to detect FDV date line'
        );
    }

    const parts =
        dateLine.trim().split(/\s+/);

    const start =
        parseYYMMDDHHMM(parts[0]);

    const end =
        parseYYMMDDHHMM(parts[1]);

    const interval =
        parseInt(parts[2]);

    // =================================================
    // PIPE SIZE EXTRACTION
    // Pipe size located immediately after CSTART
    // =================================================

    let pipeSize = '';

    const cstartIndex =
        lines.findIndex(l =>
            l.toUpperCase().includes('CSTART')
        );

    if(cstartIndex >= 0){

        const constantLine =
            lines[cstartIndex + 1];

        if(constantLine){

            const nums =
                constantLine.match(/-?\d+\.?\d*/g);

            if(nums && nums.length > 0){

                pipeSize =
                    parseFloat(nums[0]);
            }
        }
    }

    const cendIndex =
        lines.findIndex(l =>
            l.toUpperCase().includes('CEND')
        );

    if(cendIndex < 0){

        throw new Error(
            'Unable to detect FDV data section'
        );
    }

    const nums =
        lines
        .slice(cendIndex + 1)
        .join(' ')
        .trim()
        .split(/\s+/)
        .map(Number)
        .filter(v => !isNaN(v));

    const flow = [];
    const depth = [];
    const velocity = [];

    for(let i=0;i<nums.length;i+=3){

        flow.push(nums[i] || 0);
        depth.push(nums[i+1] || 0);
        velocity.push(nums[i+2] || 0);
    }

    const timestamps =
        generateTimeline(
            start,
            interval,
            depth.length
        );

    let type = 'FM';

    if(identifier.startsWith('DM')) type='DM';
    if(identifier.startsWith('RM')) type='RM';

    return {
        identifier,
        type,
        start,
        end,
        interval,
        pipeSize,
        timestamps,
        flow,
        depth,
        velocity
    };
}

// =====================================================
// RAIN GAUGE PARSER
// =====================================================

function parseRain(text){

    const lines = text.split(/\r?\n/);

    const identifierMatch =
        text.match(/\bRG\d+\b/i);

    if(!identifierMatch){

        throw new Error(
            'Unable to detect RG identifier'
        );
    }

    const identifier =
        identifierMatch[0].toUpperCase();

    const dateLine =
        lines.find(l => /^\d{10}/.test(l.trim()));

    if(!dateLine){

        throw new Error(
            'Unable to detect RG date line'
        );
    }

    const parts =
        dateLine.trim().split(/\s+/);

    const start =
        parseYYMMDDHHMM(parts[0]);

    const end =
        parseYYMMDDHHMM(parts[1]);

    const interval =
        parseInt(parts[2]);

    const cendIndex =
        lines.findIndex(l =>
            l.toUpperCase().includes('CEND')
        );

    if(cendIndex < 0){

        throw new Error(
            'Unable to detect RG data section'
        );
    }

    const intensity =
        lines
        .slice(cendIndex + 1)
        .join(' ')
        .trim()
        .split(/\s+/)
        .map(Number)
        .filter(v => !isNaN(v));

    const timestamps =
        generateTimeline(
            start,
            interval,
            intensity.length
        );

    return {
        identifier,
        start,
        end,
        interval,
        timestamps,
        intensity
    };
}

// =====================================================
// RAINFALL SYNCHRONIZATION ENGINE
// =====================================================

function synchronizeRain(monitor, rain){

    const map = new Map();

    rain.timestamps.forEach((t,i)=>{

        map.set(
            t.getTime(),
            rain.intensity[i]
        );
    });

    const aligned = [];

    monitor.timestamps.forEach(t=>{

        aligned.push(
            map.get(t.getTime()) || 0
        );
    });

    return aligned;
}

// =====================================================
// CUMULATIVE RAINFALL ENGINE
// =====================================================

function cumulativeRain(intensity, interval){

    let total = 0;

    const arr = [];

    intensity.forEach(v=>{

        total += v * (interval/60);

        arr.push(total);
    });

    return arr;
}

// =====================================================
// DASHBOARD RENDER ENGINE
// =====================================================

function renderDashboard(){

    const monitor =
        monitors[currentMonitorIndex];

    const rain =
        rainGauges.find(r =>
            r.identifier ===
            document.getElementById('rainSelect').value
        );

    const rainAligned =
        synchronizeRain(monitor, rain);

    const labels =
        monitor.timestamps;

    document.getElementById('monitorTitle').innerText =
        monitor.identifier;

    document.getElementById('pipeSize').value =
        monitor.pipeSize + ' mm';

    const green = '#0f9d58';
    const blue = '#1e88e5';

    if(mainChart) mainChart.destroy();

    mainChart = new Chart(
        document.getElementById('mainChart'),
        {
            type:'line',

            data:{
                labels,

                datasets:[

                    {
                        label:'Rainfall (mm/hr)',
                        data:rainAligned,
                        borderColor:blue,
                        backgroundColor:'rgba(30,136,229,0.2)',
                        yAxisID:'yRain',
                        stepped:true
                    },

                    {
                        label:'Depth (mm)',
                        data:monitor.depth,
                        borderColor:green,
                        yAxisID:'y'
                    },

                    {
                        label:'Flow (l/s)',
                        data:monitor.flow,
                        borderColor:green,
                        borderDash:[5,5],
                        yAxisID:'y'
                    },

                    {
                        label:'Velocity (m/s)',
                        data:monitor.velocity,
                        borderColor:green,
                        borderDash:[2,2],
                        yAxisID:'y'
                    }
                ]
            },

            options:{

                responsive:true,
                maintainAspectRatio:false,

                interaction:{
                    mode:'index',
                    intersect:false
                },

                plugins:{
                    legend:{
                        position:'bottom'
                    }
                },

                scales:{

                    x:{
                        ticks:{
                            callback:(v)=>formatDate(labels[v])
                        }
                    },

                    y:{
                        position:'left'
                    },

                    yRain:{
                        reverse:true,
                        position:'right'
                    }
                }
            }
        }
    );

    const scatterDisabled =
        monitor.type !== 'FM';

    document.getElementById('scatterChart')
        .parentElement
        .classList
        .toggle('greyed', scatterDisabled);

    if(scatterChart) scatterChart.destroy();

    scatterChart = new Chart(
        document.getElementById('scatterChart'),
        {
            type:'scatter',

            data:{
                datasets:[{

                    label:'Depth vs Velocity',

                    data:monitor.depth.map((d,i)=>({
                        x:monitor.velocity[i],
                        y:d / 1000
                    })),

                    pointBackgroundColor:'red'
                }]
            },

            options:{

                responsive:true,
                maintainAspectRatio:false,

                scales:{

                    x:{
                        title:{
                            display:true,
                            text:'Velocity (m/s)'
                        }
                    },

                    y:{
                        title:{
                            display:true,
                            text:'Depth (m)'
                        }
                    }
                }
            }
        }
    );

    if(cumulativeChart) cumulativeChart.destroy();

    const colors = [
        '#1565c0',
        '#42a5f5',
        '#90caf9'
    ];

    cumulativeChart = new Chart(
        document.getElementById('cumulativeChart'),
        {
            type:'line',

            data:{

                labels,

                datasets:
                    rainGauges.map((rg,i)=>{

                    const aligned =
                        synchronizeRain(monitor, rg);

                    const cum =
                        cumulativeRain(
                            aligned,
                            monitor.interval
                        );

                    return {

                        label:
                            `${rg.identifier} (${cum[cum.length-1].toFixed(1)} mm)`,

                        data:cum,

                        borderColor:
                            colors[i % colors.length],

                        tension:0.2
                    };
                })
            },

            options:{

                responsive:true,
                maintainAspectRatio:false,

                plugins:{
                    legend:{
                        position:'bottom'
                    }
                },

                scales:{
                    x:{
                        ticks:{
                            callback:(v)=>formatDate(labels[v])
                        }
                    }
                }
            }
        }
    );

    const totalRain =
        cumulativeRain(
            rainAligned,
            monitor.interval
        ).slice(-1)[0] || 0;

    const totalVolume =
        monitor.flow.reduce((a,b)=>
            a + b * (monitor.interval * 60),
            0
        ) / 1000;

    document.getElementById('timeRange').innerText =
        `${monitor.start.toLocaleString()} to ${monitor.end.toLocaleString()}`;

    document.getElementById('totalRain').innerText =
        totalRain.toFixed(1);

    document.getElementById('maxRain').innerText =
        Math.max(...rainAligned).toFixed(1);

    document.getElementById('maxDepth').innerText =
        Math.max(...monitor.depth).toFixed(1);

    document.getElementById('maxFlow').innerText =
        Math.max(...monitor.flow).toFixed(1);

    document.getElementById('maxVelocity').innerText =
        Math.max(...monitor.velocity).toFixed(2);

    document.getElementById('totalVolume').innerText =
        totalVolume.toFixed(1);
}

// =====================================================
// FILE IMPORT ENGINE
// =====================================================

async function handleFiles(files){

    try{

        dropZone.innerHTML =
            `<h2>Processing Files...</h2>
             <p>Please wait while telemetry is parsed.</p>`;

        monitors.length = 0;
        rainGauges.length = 0;

        let processed = 0;

        for(const file of files){

            const text =
                await file.text();

            if(file.name.toLowerCase().endsWith('.fdv')){

                monitors.push(
                    parseFDV(text)
                );
            }

            if(file.name.toLowerCase().endsWith('.r')){

                rainGauges.push(
                    parseRain(text)
                );
            }

            processed++;

            dropZone.innerHTML =
                `<h2>Processing Files...</h2>
                 <p>${processed} / ${files.length} files processed</p>`;
        }

        monitors.sort((a,b)=>
            a.identifier.localeCompare(b.identifier)
        );

        rainGauges.sort((a,b)=>
            a.identifier.localeCompare(b.identifier)
        );

        if(monitors.length === 0){

            throw new Error(
                'No FDV monitor files detected'
            );
        }

        if(rainGauges.length === 0){

            throw new Error(
                'No Rain Gauge files detected'
            );
        }

        const monitorSelect =
            document.getElementById('monitorSelect');

        const rainSelect =
            document.getElementById('rainSelect');

        monitorSelect.innerHTML = '';
        rainSelect.innerHTML = '';

        monitors.forEach((m,i)=>{

            const op =
                document.createElement('option');

            op.value = i;
            op.textContent = m.identifier;

            monitorSelect.appendChild(op);
        });

        rainGauges.forEach(r=>{

            const op =
                document.createElement('option');

            op.value = r.identifier;
            op.textContent = r.identifier;

            rainSelect.appendChild(op);
        });

        dropZone.innerHTML =
            `<h2>Files Loaded Successfully</h2>
             <p>${monitors.length} monitors loaded</p>
             <p>${rainGauges.length} rain gauges loaded</p>`;

        setTimeout(()=>{

            document.getElementById('dropZone').style.display='none';

            document.getElementById('app').style.display='block';

        },1000);

        monitorSelect.onchange = ()=>{

            currentMonitorIndex =
                parseInt(monitorSelect.value);

            renderDashboard();
        };

        rainSelect.onchange = ()=>{

            renderDashboard();
        };

        document.getElementById('prevBtn').onclick = ()=>{

            currentMonitorIndex =
                (currentMonitorIndex - 1 + monitors.length)
                % monitors.length;

            monitorSelect.value =
                currentMonitorIndex;

            renderDashboard();
        };

        document.getElementById('nextBtn').onclick = ()=>{

            currentMonitorIndex =
                (currentMonitorIndex + 1)
                % monitors.length;

            monitorSelect.value =
                currentMonitorIndex;

            renderDashboard();
        };

        renderDashboard();

    }

    catch(err){

        console.error(err);

        dropZone.innerHTML =
            `<h2>ERROR</h2>
             <p>${err.message}</p>`;
    }
}

// =====================================================
// DRAG DROP EVENTS
// =====================================================

const dropZone =
    document.getElementById('dropZone');

dropZone.addEventListener('dragover', e=>{

    e.preventDefault();

    dropZone.classList.add('dragover');
});

dropZone.addEventListener('dragleave', ()=>{

    dropZone.classList.remove('dragover');
});

dropZone.addEventListener('drop', e=>{

    e.preventDefault();

    dropZone.classList.remove('dragover');

    const files =
        e.dataTransfer.files;

    handleFiles(files);
});

</script>

</body>
</html>
