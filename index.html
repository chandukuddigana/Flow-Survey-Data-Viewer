<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Survey Data Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; color: #222; background-color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
        
        /* Master Sidebar */
        .sidebar { width: 280px; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; border-right: 1px solid #1e293b; flex-shrink: 0; }
        .sidebar-header { padding: 20px; background: #020617; border-bottom: 1px solid #1e293b; }
        .sidebar-header h2 { margin: 0; font-size: 14px; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; }
        .file-list { flex: 1; overflow-y: auto; padding: 15px 10px; }
        .list-section-title { font-size: 11px; color: #64748b; font-weight: bold; text-transform: uppercase; margin: 15px 0 5px 5px; letter-spacing: 0.5px; }
        .station-item { padding: 10px 12px; margin-bottom: 6px; border-radius: 6px; background: #1e293b; cursor: pointer; font-size: 13px; border: 1px solid #334155; }
        .station-item.active { background: #22c55e; border-color: #4ade80; color: #fff; font-weight: bold; }
        .rain-inventory-item { padding: 8px 12px; margin-bottom: 4px; border-radius: 4px; background: #1e3a8a; font-size: 12px; color: #dbeafe; }

        /* Content Area */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; height: 100%; }
        .top-banner { background: #fff; padding: 15px 30px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .upload-zone { border: 2px dashed #38bdf8; padding: 35px 25px; text-align: center; background: #fff; border-radius: 8px; margin: 25px; cursor: pointer; }
        
        .workspace-view { display: none; padding: 25px; }
        .graph-pane { background: #fff; padding: 15px; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 20px; height: 200px; position: relative; }
        .stats-container-block { margin-top: 20px; border: 1.5px solid #1e3a8a; padding: 15px; background: #fff; }
        .stats-layout-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: center; }
        .stats-layout-table th, .stats-layout-table td { border: 1px solid #1e3a8a; padding: 8px; }
        .label-cell { background-color: #f0f4f8; font-weight: bold; color: #1e3a8a; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header"><h2>Flow Survey Data Viewer</h2></div>
        <div class="file-list">
            <div class="list-section-title">Select Monitor</div>
            <div id="fdvListContainer"></div>
            <div class="list-section-title">Rainfall Sources</div>
            <div id="rainInventoryContainer"></div>
        </div>
    </div>

    <div class="main-content">
        <div class="top-banner"><h1 id="activeViewTitle">Upload Data to Begin</h1></div>
        
        <div class="upload-zone" id="dropZone">
            <input type="file" id="fileInput" multiple style="display:none">
            <p>Click to select <b>.FDV</b> and <b>.R</b> files</p>
        </div>

        <div class="workspace-view" id="workspaceView">
            <div class="graph-pane" id="rainPane"><h3>Rainfall Intensity (mm/hr)</h3><canvas id="rainChart"></canvas></div>
            <div class="graph-pane"><h3>Cumulative Rainfall (mm)</h3><canvas id="cumulativeChart"></canvas></div>
            
            <div class="stats-container-block">
                <table class="stats-layout-table">
                    <thead>
                        <tr><th>Metric</th><th>Rain (mm/hr)</th><th>Depth (mm)</th><th>Flow (L/s)</th><th>Velocity (m/s)</th></tr>
                    </thead>
                    <tbody id="statsTableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // The core parsing logic for Intensity (mm/hr) to Depth (mm)
        function processRainFile(text) {
            const lines = text.split(/\r?\n/);
            let intervalMinutes = 2, inData = false, rawValues = [];
            // Assuming your *CSTART logic exists here to find intervalMinutes
            const intervalHours = intervalMinutes / 60;
            
            // ... (Your existing loop to populate rawValues) ...
            
            const intensity = rawValues;
            const depth = rawValues.map(val => val * intervalHours);
            return { intensity, depth, intervalHours };
        }
        
        // ... (Include your chart.js renderers here) ...
    </script>
</body>
</html>
